# Ultralytics YOLO-pose dataset config: SynFoot V1 pretraining.
# One class (foot) with two keypoints (heel, toe). Generated by
# synfoot_to_yolo.py — do not hand-edit.
# NOTE: Ultralytics resolves a relative `path:` against its own datasets_dir,
# not against this file — on Colab the notebook rewrites it to the absolute
# VM path before training.

path: datasets/synfoot
train: images/train
val: images/val

names:
  0: foot

# [num_keypoints, dims]; dims=3 means x, y, visibility per point.
kpt_shape: [2, 3]

# Single symmetric schema (heel, toe): mirror needs no relabeling.
flip_idx: [0, 1]
