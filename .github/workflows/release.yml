name: Release APK

# Triggered when a version tag (vX.Y.Z) is pushed. Builds the release APK,
# creates a GitHub Release with the APK attached, then updates
# releases/version.json + releases/changelog.json on `main` (so the in-app
# update checker sees the new build immediately).
#
# Usage:
#   1. Bump `version:` in pubspec.yaml and commit it to main.
#   2. Create an annotated tag with the release notes (one bullet per line)
#      and push it:
#        git tag -a v1.0.1 -m "Fixed login crash
#        Improved startup time"
#        git push origin v1.0.1
#   3. The workflow does the rest — the app's "Download" button then works
#      end-to-end from:
#        https://github.com/<owner>/<repo>/releases/download/v1.0.1/app-release-1.0.1.apk
#      (exactly the apk_url written into version.json).
#
# Notes are read from the annotated tag message (each line becomes a changelog
# bullet). If the tag has no message, GitHub auto-generates the release notes.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS
#   (+ optional ANDROID_KEY_PASSWORD, defaulting to the keystore password)
# They carry the project's release signing key, created once with
# `tool/setup_release_signing.sh` — see docs/RELEASE_SIGNING.md.
#
# The job FAILS without them, on purpose. A CI runner has no debug keystore,
# so a build that falls back to `signingConfigs.debug` is signed with a
# brand-new throwaway key, and Android refuses to replace an installed app
# whose signer differs: every tester's in-app update ends in "App not
# installed." Signing with one stable key is the fix, and skipping it silently
# would ship the same broken update again.
#
# The app reads its Supabase/MapTiler values from lib/constants/app_constants.dart,
# not dart-defines — so the secrets above are the only ones this job needs.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release v${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          # Without these, android/app/build.gradle falls back to
          # signingConfigs.debug and the APK gets a runner-generated key that
          # cannot be installed over any previous release. Stop now and say
          # exactly what is missing rather than publish a broken update.
          missing=()
          [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "${ANDROID_KEY_ALIAS:-}" ]] && missing+=("ANDROID_KEY_ALIAS")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository secret(s): ${missing[*]}. Run tool/setup_release_signing.sh, then add them under Settings → Secrets and variables → Actions → Repository secrets. Refusing to publish a debug-signed APK."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/cufmai-release.jks
          if [[ ! -s android/app/cufmai-release.jks ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore. Re-run 'base64 -w0 android/app/cufmai-release.jks' and update the secret."
            exit 1
          fi

          # storeFile is resolved relative to the app module (android/app/).
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=cufmai-release.jks"
          } > android/key.properties

          # Fail here (not 8 minutes into the build) if the secrets don't match
          # the keystore — wrong password, wrong alias, wrong file.
          keytool -list -keystore android/app/cufmai-release.jks \
            -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          echo "✔ Signing key loaded for alias '$ANDROID_KEY_ALIAS'"

      - name: Build release APK
        shell: bash
        env:
          # Optional feature switches for this release, space separated, e.g.
          #   SHOE_MODEL_REQUEST=true ADMIN_MODEL_UPLOAD=true
          # Set once in Settings → Secrets and variables → Actions → Variables.
          # Absent (the default) means the build carries every switch's shipped
          # default — which is how a flag-gated surface ends up "missing" from a
          # release that claims it shipped it. See README → "Feature switches in
          # a release" for the list and the recipe.
          RELEASE_DART_DEFINES: ${{ vars.RELEASE_DART_DEFINES }}
        run: |
          set -euo pipefail

          ARGS=(--release)
          if [[ -n "${RELEASE_DART_DEFINES:-}" ]]; then
            read -ra DEFINES <<< "$RELEASE_DART_DEFINES"
            for define in "${DEFINES[@]}"; do
              ARGS+=("--dart-define=$define")
            done
          fi

          # Echoed, because "does this APK have the request flow?" should be
          # answerable from the release log rather than by rebuilding it.
          echo "→ flutter build apk ${ARGS[*]}"
          flutter build apk "${ARGS[@]}"

      - name: Verify the APK signer is the release key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          # Both tools print the fingerprint differently (colons, case, spaces).
          normalize() { tr -d ':\r' | tr 'A-Z' 'a-z' | tr -d ' '; }

          EXPECTED="$(keytool -list -v -keystore android/app/cufmai-release.jks \
            -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | normalize)"

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" \
            -maxdepth 2 -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::warning::apksigner not found — skipping the comparison (the key that built this APK has SHA-256 $EXPECTED)."
            exit 0
          fi

          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -1 | sed 's/.*digest: *//' | normalize)"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::app-release.apk is not signed by the project release key (expected $EXPECTED, got ${ACTUAL:-none}). Publishing it would break the in-app update on every device."
            exit 1
          fi

          # The line to keep in the release notes: if this fingerprint ever
          # changes between releases, installed apps stop being updatable.
          echo "✔ Signed by the project release key — SHA-256 $EXPECTED"

      - name: Create GitHub Release + upload APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ASSET="app-release-$VERSION.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi

          # Re-run friendly: skip if the release already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping creation."
          else
            # Copy the APK under the versioned name so the uploaded asset name
            # matches the apk_url written into version.json exactly (gh's
            # `path#displayname` rename proved unreliable on the runner).
            cp "$APK" "build/app/outputs/flutter-apk/$ASSET"

            # Read the annotated tag message. On tag-triggered runs checkout can
            # leave a lightweight local ref where %(contents) dereferences to the
            # commit message, so force-fetch the tag object and use git cat-file.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_NOTES=""
            if [[ "$(git cat-file -t "$TAG" 2>/dev/null)" == "tag" ]]; then
              TAG_NOTES="$(git cat-file tag "$TAG" | sed '1,/^$/d')"
            fi

            if [[ -n "$TAG_NOTES" ]]; then
              gh release create "$TAG" "build/app/outputs/flutter-apk/$ASSET" --title "$TAG" --notes "$TAG_NOTES"
            else
              gh release create "$TAG" "build/app/outputs/flutter-apk/$ASSET" --title "$TAG" --generate-notes
            fi
          fi

          echo "Download URL: https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"

      - name: Update version.json + changelog.json and push to main
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"            # e.g. v1.0.1
          VERSION="${TAG#v}"                # e.g. 1.0.1

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match vX.Y.Z, got '$TAG'"
            exit 1
          fi

          # We're on the tag's commit (detached HEAD). Update the JSONs here,
          # commit, and fast-forward main to include this release — this keeps
          # main in sync with the tagged code even if the tag was pushed first.
          RELEASED_AT="$(date +%Y-%m-%d)"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/app-release-$VERSION.apk"

          # Release notes from the annotated tag message; each line = one bullet.
          # Force-fetch the tag object first — on tag-triggered runs the local
          # ref can be lightweight, where %(contents) yields the commit message.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES=""
          if [[ "$(git cat-file -t "$TAG" 2>/dev/null)" == "tag" ]]; then
            NOTES="$(git cat-file tag "$TAG" | sed '1,/^$/d' | tr '\n' '|' | sed 's/||*/|/g; s/^|//; s/|$//')"
          fi

          NOTES_ARGS=()
          if [[ -n "$NOTES" ]]; then
            NOTES_ARGS=(--notes "$NOTES")
          fi

          dart run releases/update_release_files.dart \
            --version "$VERSION" \
            --apk-url "$APK_URL" \
            --released-at "$RELEASED_AT" \
            --skip-pubspec \
            "${NOTES_ARGS[@]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add releases/version.json releases/changelog.json
          if git diff --cached --quiet; then
            echo "::notice::No JSON changes to commit (already up to date)."
            exit 0
          fi

          # Fail loudly if main can't be fast-forwarded to include this release.
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Cannot fast-forward main to tag $TAG — main has commits the tag doesn't. Tag the latest main commit (push main first)."
            exit 1
          fi

          git commit -m "release: update version.json + changelog for $TAG"
          git push origin HEAD:main

      - name: Upload APK artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
