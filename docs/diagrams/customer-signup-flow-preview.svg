<path d="M580,485 L580,550" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="580,550 584.5,539 575.5,539" fill="#000000"/>
<path d="M440,595 L295,595" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="295,595 306,599.5 306,590.5" fill="#000000"/><text x="367.5" y="599" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">No</text>
<path d="M170,562 L170,435 L430,435" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="430,435 419,430.5 419,439.5" fill="#000000"/><text x="300" y="439" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Send back to the form</text>
<path d="M580,640 L580,700" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="580,700 584.5,689 575.5,689" fill="#000000"/><text x="580" y="674" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Yes</text>
<path d="M720,745 L950,745" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="950,745 939,740.5 939,749.5" fill="#000000"/><text x="835" y="749" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Yes</text>
<path d="M1230,745 L1230,745 L1230,460 L730,460" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="730,460 741,464.5 741,455.5" fill="#000000"/><text x="980" y="464" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Send back to the form</text>
<path d="M580,790 L580,840" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="580,840 584.5,829 575.5,829" fill="#000000"/><text x="580" y="819" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">No</text>
<path d="M580,895 L580,945" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="580,945 584.5,934 575.5,934" fill="#000000"/>
<path d="M720,995 L950,995" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="950,995 939,990.5 939,999.5" fill="#000000"/><text x="835" y="999" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">No</text>
<path d="M950,995 L810,995 L810,1460 L730,1460" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="730,1460 741,1464.5 741,1455.5" fill="#000000"/><text x="810" y="1231.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Signed in right away</text>
<path d="M580,1045 L580,1100" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="580,1100 584.5,1089 575.5,1089" fill="#000000"/><text x="580" y="1076.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Yes — this is the usual setting</text>
<path d="M580,1156 L580,1205" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="580,1205 584.5,1194 575.5,1194" fill="#000000"/>
<path d="M720,1250 L860,1250 L860,1208 L950,1208" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="950,1208 939,1203.5 939,1212.5" fill="#000000"/><text x="790" y="1254" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">They type the code</text>
<path d="M720,1273 L880,1273 L880,1293 L950,1293" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="950,1293 939,1288.5 939,1297.5" fill="#000000"/><text x="800" y="1277" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">They tap the email</text>
<path d="M1230,1208 L1270,1208" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="1270,1208 1259,1203.5 1259,1212.5" fill="#000000"/>
<path d="M1410,1173 L1410,1128 L730,1128" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="730,1128 741,1132.5 741,1123.5" fill="#000000"/><text x="1070" y="1132" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Send a new code</text>
<path d="M950,1194 L790,1194 L790,1445 L730,1445" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="730,1445 741,1449.5 741,1440.5" fill="#000000"/>
<path d="M950,1279 L760,1279 L760,1475 L730,1475" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="730,1475 741,1479.5 741,1470.5" fill="#000000"/>
<path d="M440,1250 L295,1250" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="295,1250 306,1254.5 306,1245.5" fill="#000000"/><text x="367.5" y="1254" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Back to sign in</text>
<path d="M45,1250 L20,1250 L20,304 L430,304" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="430,304 419,299.5 419,308.5" fill="#000000"/>
