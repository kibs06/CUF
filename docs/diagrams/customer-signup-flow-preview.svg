<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2060" viewBox="0 0 1680 2060">
<text font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#000000"><tspan x="45" y="35.92">How a customer creates an account and starts shopping</tspan></text>
<rect x="1300" y="8" width="290" height="150" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="1445" y="54.919999999999995">Legend</tspan><tspan x="1445" y="71.12">Oval — the start and the finish</tspan><tspan x="1445" y="87.32">Box — a step in the flow</tspan><tspan x="1445" y="103.52000000000001">Diamond — a question (Yes or No)</tspan><tspan x="1445" y="119.72">Dashed box — extra explanation</tspan></text>
<rect x="470" y="70" width="220" height="50" rx="25" ry="25" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000"><tspan x="580" y="99.68">Customer opens the app</tspan></text>
<polygon points="580,160 720,205 580,250 440,205" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="209.68">First time opening the app?</tspan></text>
<rect x="950" y="172" width="280" height="66" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="1090" y="209.32">Show the 3 welcome slides — they can skip them</tspan></text>
<rect x="430" y="290" width="300" height="56" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="322.68">Show the Sign up / Sign in screen</tspan></text>
<rect x="45" y="355" width="250" height="66" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="170" y="392.32">Already have an account? They just sign in</tspan></text>
<rect x="950" y="285" width="280" height="66" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="1090" y="322.32">Shop owners use a different form to apply</tspan></text>
<rect x="430" y="385" width="300" height="100" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="404.58">They fill in the Create Account form</tspan><tspan x="580" y="422.13">name  •  email  •  mobile number (optional)</tspan><tspan x="580" y="439.68">birthday  •  gender (optional)</tspan><tspan x="580" y="457.22999999999996">password  •  confirm the password</tspan><tspan x="580" y="474.78">they agree to the Terms</tspan></text>
<polygon points="580,550 720,595 580,640 440,595" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="599.68">Is everything filled in correctly?</tspan></text>
<rect x="45" y="562" width="250" height="66" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="170" y="599.32">Show a message on the item that needs fixing</tspan></text>
<polygon points="580,700 720,745 580,790 440,745" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="749.68">Is this email already used?</tspan></text>
<rect x="950" y="712" width="280" height="66" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="1090" y="749.32">Tell them this email is already registered</tspan></text>
<rect x="430" y="840" width="300" height="55" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="872.18">Create the account</tspan></text>
<polygon points="580,945 720,995 580,1045 440,995" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="999.68">Do they confirm their email?</tspan></text>
<rect x="950" y="962" width="280" height="66" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="1090" y="999.32">No — this is not the usual setting, they are signed in right away</tspan></text>
<rect x="430" y="1100" width="300" height="56" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="1132.68">We email them a 6-digit code</tspan></text>
<polygon points="580,1205 720,1250 580,1295 440,1250" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="1254.68">How do they confirm it?</tspan></text>
<rect x="950" y="1180" width="280" height="56" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="1090" y="1212.68">They type the 6-digit code</tspan></text>
<rect x="950" y="1265" width="280" height="56" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="1090" y="1297.68">They tap the button in the email</tspan></text>
<rect x="1270" y="1173" width="280" height="70" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="1410" y="1212.32">The code is wrong or has expired — show an error, then let them send a new one</tspan></text>
<rect x="45" y="1217" width="250" height="66" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="170" y="1254.32">They tap Back to sign in and stop here</tspan></text>
<rect x="430" y="1430" width="300" height="60" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="1464.68">Account confirmed — the customer is signed in</tspan></text>
<rect x="430" y="1530" width="300" height="55" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="1562.18">Optional step: add their foot size</tspan></text>
<rect x="60" y="1640" width="280" height="60" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="200" y="1674.32">Scan their feet with the phone camera</tspan></text>
<rect x="430" y="1640" width="300" height="60" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="580" y="1674.32">Type in their shoe size</tspan></text>
<rect x="800" y="1640" width="280" height="60" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="940" y="1674.32">Skip this for now</tspan></text>
<rect x="430" y="1740" width="300" height="55" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="580" y="1772.18">They land on the Home screen</tspan></text>
<rect x="45" y="1850" width="300" height="110" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="195" y="1900.905">Home</tspan><tspan x="195" y="1918.455">Featured shoes, search, and offers</tspan></text>
<rect x="460" y="1850" width="300" height="110" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="610" y="1900.905">Store</tspan><tspan x="610" y="1918.455">Browse the shops and their shoes</tspan></text>
<rect x="875" y="1850" width="300" height="110" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="1025" y="1900.905">Notifications</tspan><tspan x="1025" y="1918.455">Order updates and messages</tspan></text>
<rect x="1290" y="1850" width="300" height="110" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000"><tspan x="1440" y="1900.905">Profile</tspan><tspan x="1440" y="1918.455">Orders, addresses, reviews, settings</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#000000"><tspan x="380" y="2012.92">This is where the customer starts shopping.</tspan></text>
<rect x="950" y="1417" width="280" height="86" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="1090" y="1454">Signing in also checks: new-phone code,</tspan><tspan x="1090" y="1470">fingerprint, locked screen, suspended</tspan><tspan x="1090" y="1486">account, extra code. New accounts skip these.</tspan></text>
<rect x="1150" y="1640" width="280" height="70" rx="0" ry="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000"><tspan x="1290" y="1669">If the scan fails, they land back here</tspan><tspan x="1290" y="1685">and can type it in or skip. Skipping is instant.</tspan></text>
<path d="M580,120 L580,160" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="580,160 584.5,149 575.5,149" fill="#000000"/>
<path d="M720,205 L950,205" fill="none" stroke="#000000" stroke-width="1.5"/><polygon points="950,205 939,200.5 939,209.5" fill="#000000"/><text x="835" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">First time</text>
