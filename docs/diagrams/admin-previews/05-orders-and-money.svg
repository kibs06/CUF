<rect x="420" y="261" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="294.5">Orders line up newest first —</tspan><tspan x="565" y="312.5">search, dates and stage filters</tspan><tspan x="565" y="330.5">find the stuck ones.</tspan></text>
<rect x="420" y="432" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="465.0">They open an order to see items,</tspan><tspan x="565" y="483.0">payment, address and stage.</tspan></text>
<polygon points="565,584 720,659 565,734 410,659" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="659.0">Move it a stage on?</tspan></text>
<polygon points="843,617 1065,617 1047,701 825,701" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="650.0">Not yet — they leave it</tspan><tspan x="945" y="668.0">and check back later.</tspan></text>
<circle cx="945" cy="793" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="793.0">A</tspan></text>
<rect x="420" y="802" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="835.0">They shift the stage as the shop</tspan><tspan x="565" y="853.0">packs, ships and hands over.</tspan></text>
<rect x="420" y="954" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="987.5">On Money they scan the piles —</tspan><tspan x="565" y="1005.5">paid, waiting, failed,</tspan><tspan x="565" y="1023.5">out of date and called off.</tspan></text>
<rect x="420" y="1125" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1158.5">Top cards sum paid takings,</tspan><tspan x="565" y="1176.5">fees and the failed pile,</tspan><tspan x="565" y="1194.5">with a daily chart.</tspan></text>
<polygon points="565,1296 720,1371 565,1446 410,1371" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1362.0">Does the money</tspan><tspan x="565" y="1380.0">add up in the Database?</tspan></text>
