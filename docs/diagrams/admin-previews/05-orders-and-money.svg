<polygon points="843,1319.5 1065,1319.5 1047,1422.5 825,1422.5" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1353.0">Failed or odd ones get</tspan><tspan x="945" y="1371.0">a closer look with the order</tspan><tspan x="945" y="1389.0">open beside them.</tspan></text>
<polygon points="438,1574 710,1574 692,1658 420,1658" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1607.0">The list can leave as a sheet</tspan><tspan x="565" y="1625.0">for the books.</tspan></text>
