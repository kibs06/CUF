<polygon points="525,130 605,130 605,176.62 565,193 525,176.62" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="157.3">CB</tspan></text>
<rect x="420" y="261" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="294.5">Flags land newest first —</tspan><tspan x="565" y="312.5">rude words, spam and scams,</tspan><tspan x="565" y="330.5">fake items and knock-offs.</tspan></text>
<rect x="420" y="432" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="465.0">Red flags and counters point</tspan><tspan x="565" y="483.0">at the urgent ones.</tspan></text>
<polygon points="438,584 710,584 692,668 420,668" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="617.0">They open one to see who told,</tspan><tspan x="565" y="635.0">who it is about and the proof.</tspan></text>
<polygon points="565,736 720,811 565,886 410,811" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="802.0">Did someone break</tspan><tspan x="565" y="820.0">the house rules?</tspan></text>
<polygon points="843,759.5 1065,759.5 1047,862.5 825,862.5" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="793.0">They warn, hide the item,</tspan><tspan x="945" y="811.0">pause the seller or refund,</tspan><tspan x="945" y="829.0">then thank the one who told.</tspan></text>
<polygon points="843,930.5 1065,930.5 1047,1014.5 825,1014.5" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="963.5">Refund issued — the money</tspan><tspan x="945" y="981.5">moves back to the buyer.</tspan></text>
<polygon points="438,954 710,954 692,1057 420,1057" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="987.5">They mark it fixed — saying</tspan><tspan x="565" y="1005.5">what was done — or let it go,</tspan><tspan x="565" y="1023.5">reason on record.</tspan></text>
<polygon points="438,1125 710,1125 692,1228 420,1228" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1158.5">Word goes back to the one</tspan><tspan x="565" y="1176.5">who told — ready words</tspan><tspan x="565" y="1194.5">or the office’s own.</tspan></text>
<polygon points="438,1296 710,1296 692,1380 420,1380" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1329.0">On Banners they shape the home</tspan><tspan x="565" y="1347.0">strip — photo, words, link, dates.</tspan></text>
<polygon points="438,1448 710,1448 692,1532 420,1532" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1481.0">They nudge the order, set dates</tspan><tspan x="565" y="1499.0">and flip each flag on or off.</tspan></text>
<polygon points="565,1600 720,1675 565,1750 410,1675" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1657.0">Does every link</tspan><tspan x="565" y="1675.0">have its target</tspan><tspan x="565" y="1693.0">in the Database?</tspan></text>
<circle cx="565" cy="1798" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1798.0">DB1</tspan></text>
<polygon points="843,1633 1065,1633 1047,1717 825,1717" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1666.0">They fill the missing target</tspan><tspan x="945" y="1684.0">or drop the link.</tspan></text>
<polygon points="438,1878 710,1878 692,1962 420,1962" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1911.0">Worn-out flags get erased</tspan><tspan x="565" y="1929.0">after a confirm.</tspan></text>
<polygon points="484,2030 646,2030 646,2090.68 565,2112 484,2090.68" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="2055.8">Dd</tspan><tspan x="565" y="2072.8">back to the Dashboard</tspan></text>
<rect x="30" y="2040" width="250" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="2067.0">Nasty cases can pause a seller</tspan><tspan x="155" y="2085.0">straight from the complaint.</tspan></text>
<rect x="825" y="2040" width="240" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="2067.0">Old flags can be erased</tspan><tspan x="945" y="2085.0">when the season turns.</tspan></text>
