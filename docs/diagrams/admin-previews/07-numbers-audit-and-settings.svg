<polygon points="525,130 605,130 605,176.62 565,193 525,176.62" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="157.3">NAS</tspan></text>
<polygon points="438,261 710,261 692,364 420,364" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="294.5">On Numbers they pick 7, 30 or 90</tspan><tspan x="565" y="312.5">days — takings, top pairs,</tspan><tspan x="565" y="330.5">shares of order stages.</tspan></text>
<polygon points="438,432 710,432 692,535 420,535" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="465.5">On Audit they pick a trail — shops,</tspan><tspan x="565" y="483.5">money, safety, sign-ins, doings —</tspan><tspan x="565" y="501.5">each with its own filters.</tspan></text>
<polygon points="438,603 710,603 692,687 420,687" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="636.0">Any trail can leave as a sheet</tspan><tspan x="565" y="654.0">for the books.</tspan></text>
<polygon points="438,755 710,755 692,858 420,858" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="788.5">On Settings they save their name,</tspan><tspan x="565" y="806.5">swap the password — six signs</tspan><tspan x="565" y="824.5">or more, typed twice the same.</tspan></text>
<polygon points="565,926 720,1001 565,1076 410,1001" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="983.0">Is the second step</tspan><tspan x="565" y="1001.0">on for this account</tspan><tspan x="565" y="1019.0">in the Database?</tspan></text>
<circle cx="565" cy="1124" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1124.0">DB1</tspan></text>
<polygon points="843,959 1065,959 1047,1043 825,1043" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="992.0">They link the authenticator</tspan><tspan x="945" y="1010.0">app for the extra code.</tspan></text>
<rect x="420" y="1204" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1237.0">Lost phone — they sign out</tspan><tspan x="565" y="1255.0">on every device at once.</tspan></text>
<polygon points="484,1356 646,1356 646,1416.68 565,1438 484,1416.68" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="1381.8">Dd</tspan><tspan x="565" y="1398.8">back to the Dashboard</tspan></text>
<rect x="30" y="1366" width="250" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1393.0">The audit shows who did what,</tspan><tspan x="155" y="1411.0">and when they did it.</tspan></text>
