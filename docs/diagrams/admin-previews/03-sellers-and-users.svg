<polygon points="438,432 710,432 692,516 420,516" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="465.0">They open an ask to see the shop,</tspan><tspan x="565" y="483.0">its papers, photos and owner.</tspan></text>
