<polygon points="438,973 710,973 692,1057 420,1057" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1006.0">Tabs and filters split shoppers,</tspan><tspan x="565" y="1024.0">sellers, admins — active or paused.</tspan></text>
