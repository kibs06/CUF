<rect x="420" y="432" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="465.0">They open a product for photos,</tspan><tspan x="565" y="483.0">price, sizes and reviews.</tspan></text>
