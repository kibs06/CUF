<rect x="420" y="614" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="647.0">The Order panel lists the items</tspan><tspan x="565" y="665.0">with the total so far.</tspan></text>
