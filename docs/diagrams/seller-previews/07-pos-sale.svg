<rect x="420" y="1250" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1283.5">The sale is saved — stock</tspan><tspan x="565" y="1301.5">goes down right away.</tspan><tspan x="565" y="1319.5">Saved to the Database.</tspan></text>
