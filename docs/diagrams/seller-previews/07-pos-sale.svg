<rect x="30" y="965" width="250" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="998.0">GCash — the sale is done</tspan><tspan x="155" y="1016.0">once the payment shows.</tspan></text>
