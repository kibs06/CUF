<rect x="30" y="297" width="170" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="115" y="331.0">Continue with</tspan><tspan x="115" y="349.0">Google — pick</tspan><tspan x="115" y="367.0">an account.</tspan><tspan x="115" y="385.0">Saved to the Database.</tspan></text>
<circle cx="364" cy="261" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="364" y="261.0">DB1</tspan></text>
<rect x="30" y="461" width="170" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="115" y="495.0">Continue with</tspan><tspan x="115" y="513.0">Facebook — pick</tspan><tspan x="115" y="531.0">an account.</tspan><tspan x="115" y="549.0">Saved to the Database.</tspan></text>
<circle cx="316" cy="522" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="316" y="522.0">DB1</tspan></text>
<rect x="420" y="475" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="508.5">They type email and password.</tspan><tspan x="565" y="526.5">Empty boxes or a short password</tspan><tspan x="565" y="544.5">are flagged first.</tspan></text>
<polygon points="565,620 720,695 565,770 410,695" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="686.0">Forgot password</tspan><tspan x="565" y="704.0">tapped?</tspan></text>
<rect x="825" y="653" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="686.0">We email a link to set</tspan><tspan x="945" y="704.0">a new one.</tspan></text>
<rect x="825" y="779" width="240" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="812.5">They open the link on the phone,</tspan><tspan x="945" y="830.5">set a new password —</tspan><tspan x="945" y="848.5">they are signed in.</tspan></text>
<circle cx="945" cy="948" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="948.0">C</tspan></text>
<polygon points="565,812 720,887 565,962 410,887" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="878.0">Is the password</tspan><tspan x="565" y="896.0">correct in the Database?</tspan></text>
<circle cx="565" cy="998" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="998.0">DB1</tspan></text>
<rect x="825" y="1014" width="240" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1047.5">Show the same error for a wrong</tspan><tspan x="945" y="1065.5">email or password —</tspan><tspan x="945" y="1083.5">they can try again.</tspan></text>
<circle cx="945" cy="1183" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1183.0">A</tspan></text>
<polygon points="565,1064 720,1139 565,1214 410,1139" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1130.0">Is this a phone the</tspan><tspan x="565" y="1148.0">app already knows?</tspan></text>
<rect x="30" y="1068.5" width="250" height="141" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1103.0">We email a 6-digit code.</tspan><tspan x="155" y="1121.0">They type it to prove it is</tspan><tspan x="155" y="1139.0">really them. If the mail fails,</tspan><tspan x="155" y="1157.0">the reason shows on the</tspan><tspan x="155" y="1175.0">same screen.</tspan></text>
<rect x="420" y="1256" width="290" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1290.0">They are signed in.</tspan><tspan x="565" y="1308.0">Saved to the Database.</tspan><tspan x="565" y="1326.0">Checks below still apply —</tspan><tspan x="565" y="1344.0">new sellers skip them.</tspan></text>
<circle cx="565" cy="1414" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1414.0">DB1</tspan></text>
<polygon points="565,1480 720,1555 565,1630 410,1555" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1546.0">Is the account</tspan><tspan x="565" y="1564.0">suspended?</tspan></text>
<rect x="825" y="1513" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1546.0">They see why it is closed.</tspan><tspan x="945" y="1564.0">Signing out leaves the screen.</tspan></text>
<polygon points="565,1672 720,1747 565,1822 410,1747" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1738.0">Does the profile</tspan><tspan x="565" y="1756.0">load from the Database?</tspan></text>
<circle cx="565" cy="1858" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1858.0">DB1</tspan></text>
<rect x="825" y="1705" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1738.0">Show Retry. They can try</tspan><tspan x="945" y="1756.0">again or sign out.</tspan></text>
<circle cx="945" cy="1855" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1855.0">B</tspan></text>
<polygon points="565,1924 720,1999 565,2074 410,1999" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1990.0">Is an extra code</tspan><tspan x="565" y="2008.0">needed? New sellers skip.</tspan></text>
<rect x="30" y="1938" width="250" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1972.0">They type the code from their</tspan><tspan x="155" y="1990.0">authenticator app. A lost phone</tspan><tspan x="155" y="2008.0">can mail a code. They can</tspan><tspan x="155" y="2026.0">also sign out.</tspan></text>
<rect x="420" y="2116" width="290" height="65" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="2148.5">They see the Dashboard.</tspan></text>
<polygon points="420,2223 710,2223 710,2291.08 565,2315 420,2291.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="2252.5">Continue on page 6</tspan><tspan x="565" y="2269.5">Dashboard</tspan></text>
<rect x="30" y="2243" width="250" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="2270.0">Too many wrong tries locks</tspan><tspan x="155" y="2288.0">the screen for a while.</tspan></text>
<rect x="825" y="2205" width="240" height="110" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="2233.0">On their own phone they can sign</tspan><tspan x="945" y="2251.0">in with a fingerprint next time.</tspan><tspan x="945" y="2269.0">First sign in offers</tspan><tspan x="945" y="2287.0">to turn it on.</tspan></text>
