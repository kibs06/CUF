<rect x="480" y="2399" width="330" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="645" y="2426.0">DB steps touch the Database;</tspan><tspan x="645" y="2444.0">DB1 marks where in the flow.</tspan></text>
