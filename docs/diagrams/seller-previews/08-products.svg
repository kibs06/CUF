<rect x="420" y="264" width="290" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="298.0">The grid shows every product:</tspan><tspan x="565" y="316.0">photo, price, what is in stock,</tspan><tspan x="565" y="334.0">featured and hidden ones.</tspan><tspan x="565" y="352.0">Loaded from the Database.</tspan></text>
