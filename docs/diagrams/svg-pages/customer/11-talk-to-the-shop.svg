<rect x="338.6615869679453" y="259.61324224908043" width="170.22070415134002" height="60.45769837099317" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="7.630583289542828" fill="#000000" text-anchor="middle"><tspan x="423.7719390436153" y="279.3">They can start from a shop,</tspan><tspan x="423.7719390436153" y="289.8">a product, an order,</tspan><tspan x="423.7719390436153" y="300.4">or the messages list.</tspan></text>
<rect x="338.6615869679453" y="344.7235943247504" width="170.22070415134002" height="71.6100893326327" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="7.630583289542828" fill="#000000" text-anchor="middle"><tspan x="423.7719390436153" y="364.7">They type their question,</tspan><tspan x="423.7719390436153" y="375.3">or pick a ready note for</tspan><tspan x="423.7719390436153" y="385.8">a first order message.</tspan><tspan x="423.7719390436153" y="396.3">Saved to the Database.</tspan></text>
