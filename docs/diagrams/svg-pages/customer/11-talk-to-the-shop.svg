<polygon points="593.2882816605361,495.57435627955863 717.2559117183396,495.57435627955863 700.3512348922754,544.8796636889123 576.383604834472,544.8796636889123" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="7.630583289542828" fill="#000000" text-anchor="middle"><tspan x="646.8197582764058" y="515.0">Send the size, colour and</tspan><tspan x="646.8197582764058" y="525.5">material they want.</tspan></text>
<polygon points="593.2882816605361,569.5323173935891 717.2559117183396,569.5323173935891 700.3512348922754,618.8376248029427 576.383604834472,618.8376248029427" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="7.630583289542828" fill="#000000" text-anchor="middle"><tspan x="646.8197582764058" y="588.9">The shop answers with a price</tspan><tspan x="646.8197582764058" y="599.5">and when it will be ready.</tspan></text>
<polygon points="593.2882816605361,643.4902785076196 717.2559117183396,643.4902785076196 700.3512348922754,692.7955859169732 576.383604834472,692.7955859169732" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="7.630583289542828" fill="#000000" text-anchor="middle"><tspan x="646.8197582764058" y="662.9">Say yes to the price —</tspan><tspan x="646.8197582764058" y="673.4">the pair goes into making.</tspan></text>
<polygon points="356.6615869679453,588.9022595901209 508.88229111928536,588.9022595901209 490.88229111928536,649.3599579611141 338.6615869679453,649.3599579611141" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="7.630583289542828" fill="#000000" text-anchor="middle"><tspan x="423.7719390436153" y="608.6">Photos and short clips can go</tspan><tspan x="423.7719390436153" y="619.1">with the words. Own messages</tspan><tspan x="423.7719390436153" y="629.7">can be taken back.</tspan></text>
<rect x="338.6615869679453" y="674.0126116657909" width="170.22070415134002" height="82.76248029427221" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="7.630583289542828" fill="#000000" text-anchor="middle"><tspan x="423.7719390436153" y="694.3">The shop replies in the same</tspan><tspan x="423.7719390436153" y="704.9">conversation — typing dots show</tspan><tspan x="423.7719390436153" y="715.4">while they write. Ticks turn</tspan><tspan x="423.7719390436153" y="725.9">once the shop has read.</tspan><tspan x="423.7719390436153" y="736.5">Loaded from the Database.</tspan></text>
