<rect x="350.761013215859" y="316.3215859030837" width="142.70044052863437" height="41.333920704845816" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="6.3969162995594715" fill="#000000" text-anchor="middle"><tspan x="422.1112334801762" y="332.6">Tap Check Out — review the order</tspan><tspan x="422.1112334801762" y="341.4">and choose where it goes.</tspan></text>
