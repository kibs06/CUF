<rect x="158.85352422907488" y="608.3654185022026" width="123.01762114537446" height="50.683259911894275" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="6.3969162995594715" fill="#000000" text-anchor="middle"><tspan x="220.3623348017621" y="624.9">GCash — the app opens GCash</tspan><tspan x="220.3623348017621" y="633.7">to pay. The order waits until</tspan><tspan x="220.3623348017621" y="642.5">the payment is confirmed.</tspan></text>
<rect x="350.761013215859" y="691.279295154185" width="142.70044052863437" height="41.333920704845816" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="6.3969162995594715" fill="#000000" text-anchor="middle"><tspan x="422.1112334801762" y="707.5">Cash on pickup — they pay at the shop</tspan><tspan x="422.1112334801762" y="716.4">when they collect it.</tspan></text>
<rect x="350.761013215859" y="753.2801762114537" width="142.70044052863437" height="50.683259911894275" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="6.3969162995594715" fill="#000000" text-anchor="middle"><tspan x="422.1112334801762" y="769.8">The order is placed — the shop sees it</tspan><tspan x="422.1112334801762" y="778.6">right away.</tspan><tspan x="422.1112334801762" y="787.4">Saved to the Database.</tspan></text>
