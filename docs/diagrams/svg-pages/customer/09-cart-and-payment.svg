<rect x="550.0495594713657" y="1042.1255506607931" width="118.09691629955948" height="44.7784140969163" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="6.3969162995594715" fill="#000000" text-anchor="middle"><tspan x="609.0980176211455" y="1055.7">If a GCash payment fails or</tspan><tspan x="609.0980176211455" y="1064.5">runs out of time, the order is</tspan><tspan x="609.0980176211455" y="1073.3">not placed — they can try again.</tspan></text>
