<polygon points="564.2211894273128,870.3929515418503 668.1464757709251,870.3929515418503 653.974845814978,911.7268722466961 550.0495594713657,911.7268722466961" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="6.3969162995594715" fill="#000000" text-anchor="middle"><tspan x="609.0980176211455" y="886.6">The order waits — they can</tspan><tspan x="609.0980176211455" y="895.5">try the payment again.</tspan></text>
