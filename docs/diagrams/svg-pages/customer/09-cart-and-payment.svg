<polygon points="173.61563876651982,489.0383259911895 281.8711453744493,489.0383259911895 267.1090308370044,530.3722466960353 158.85352422907488,530.3722466960353" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="6.3969162995594715" fill="#000000" text-anchor="middle"><tspan x="220.3623348017621" y="505.3">Add their address, then come</tspan><tspan x="220.3623348017621" y="514.1">back to check out.</tspan></text>
