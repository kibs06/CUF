<polygon points="564.2211894273128,394.5607929515419 668.1464757709251,394.5607929515419 653.974845814978,435.8947136563877 550.0495594713657,435.8947136563877" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="6.3969162995594715" fill="#000000" text-anchor="middle"><tspan x="609.0980176211455" y="410.8">Type the code — the total</tspan><tspan x="609.0980176211455" y="419.6">drops right away.</tspan></text>
