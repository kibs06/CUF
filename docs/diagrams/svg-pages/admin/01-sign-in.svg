<rect x="50" y="1946" width="1000" height="125" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="550" y="1972.5">How to read this chart:</tspan><tspan x="550" y="1990.5">oval = the start or the end  ·  rectangle = a step  ·  parallelogram = typing or a message  ·  diamond = a question</tspan><tspan x="550" y="2008.5">pentagon holds a page code — the top one is this page, the rest say where to turn</tspan><tspan x="550" y="2026.5">small circle with a letter = the flow jumps back to the same letter</tspan><tspan x="550" y="2044.5">DB pentagon = go to the Database  ·  DB1 circle = Database step in the flow</tspan></text>
