<rect x="420" y="286" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="319.0">The admin opens the portal</tspan><tspan x="565" y="337.0">sign-in screen.</tspan></text>
<polygon points="438,438 710,438 692,522 420,522" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="471.0">Pick email sign-in, or Continue</tspan><tspan x="565" y="489.0">with Google or Facebook.</tspan></text>
<polygon points="438,590 710,590 692,674 420,674" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="623.0">They type their email</tspan><tspan x="565" y="641.0">and their password.</tspan></text>
<polygon points="565,742 720,817 565,892 410,817" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="808.0">Do the details</tspan><tspan x="565" y="826.0">check out in the Database?</tspan></text>
