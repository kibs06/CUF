<rect x="420" y="264" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="297.5">They type email and password.</tspan><tspan x="565" y="315.5">Empty boxes or a short password</tspan><tspan x="565" y="333.5">are flagged first.</tspan></text>
<polygon points="565,409 720,484 565,559 410,484" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="475.0">Forgot password</tspan><tspan x="565" y="493.0">tapped?</tspan></text>
<rect x="825" y="442" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="475.0">We email a link to set</tspan><tspan x="945" y="493.0">a new one.</tspan></text>
<rect x="825" y="568" width="240" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="601.5">They open the link on the phone,</tspan><tspan x="945" y="619.5">set a new password —</tspan><tspan x="945" y="637.5">they are signed in.</tspan></text>
<circle cx="945" cy="737" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="737.0">C</tspan></text>
<polygon points="565,601 720,676 565,751 410,676" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="667.0">Is the password</tspan><tspan x="565" y="685.0">correct?</tspan></text>
<rect x="825" y="803" width="240" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="836.5">Show the same error for a wrong</tspan><tspan x="945" y="854.5">email or password —</tspan><tspan x="945" y="872.5">they can try again.</tspan></text>
<circle cx="945" cy="972" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="972.0">A</tspan></text>
<polygon points="565,793 720,868 565,943 410,868" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="859.0">Is this a phone the</tspan><tspan x="565" y="877.0">app already knows?</tspan></text>
<rect x="30" y="797.5" width="250" height="141" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="832.0">We email a 6-digit code.</tspan><tspan x="155" y="850.0">They type it to prove it is</tspan><tspan x="155" y="868.0">really them. If the mail fails,</tspan><tspan x="155" y="886.0">the reason shows on the</tspan><tspan x="155" y="904.0">same screen.</tspan></text>
<rect x="420" y="985" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1018.5">They are signed in.</tspan><tspan x="565" y="1036.5">Checks below still apply —</tspan><tspan x="565" y="1054.5">new accounts skip them.</tspan></text>
<polygon points="565,1130 720,1205 565,1280 410,1205" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1196.0">Is the account</tspan><tspan x="565" y="1214.0">suspended?</tspan></text>
<rect x="825" y="1163" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1196.0">They see why it is closed.</tspan><tspan x="945" y="1214.0">Signing out leaves the screen.</tspan></text>
<polygon points="565,1322 720,1397 565,1472 410,1397" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1388.0">Does the profile</tspan><tspan x="565" y="1406.0">load?</tspan></text>
<rect x="825" y="1355" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1388.0">Show Retry. They can try</tspan><tspan x="945" y="1406.0">again or sign out.</tspan></text>
<circle cx="945" cy="1505" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1505.0">B</tspan></text>
<polygon points="565,1514 720,1589 565,1664 410,1589" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1580.0">Is an extra code</tspan><tspan x="565" y="1598.0">needed? New accounts skip.</tspan></text>
<rect x="30" y="1528" width="250" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1562.0">They type the code from their</tspan><tspan x="155" y="1580.0">authenticator app. A lost phone</tspan><tspan x="155" y="1598.0">can mail a code. They can</tspan><tspan x="155" y="1616.0">also sign out.</tspan></text>
<rect x="420" y="1706" width="290" height="65" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1738.5">They see the Home screen.</tspan></text>
<polygon points="420,1813 710,1813 710,1881.08 565,1905 420,1881.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="1842.5">Continue on page 6</tspan><tspan x="565" y="1859.5">Home</tspan></text>
<rect x="30" y="1833" width="250" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1860.0">Too many wrong tries locks</tspan><tspan x="155" y="1878.0">the screen for a while.</tspan></text>
<rect x="825" y="1795" width="240" height="110" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1823.0">On their own phone they can sign</tspan><tspan x="945" y="1841.0">in with a fingerprint next time.</tspan><tspan x="945" y="1859.0">First sign in offers</tspan><tspan x="945" y="1877.0">to turn it on.</tspan></text>
