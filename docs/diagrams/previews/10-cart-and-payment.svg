<polygon points="420,130 710,130 710,198.07999999999998 565,222 420,198.07999999999998" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="159.5">From pages 6, 7, 8 or 9</tspan><tspan x="565" y="176.5">they opened the Cart</tspan></text>
<rect x="420" y="264" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="297.0">The Cart lists what they picked:</tspan><tspan x="565" y="315.0">the item, the size and how many.</tspan></text>
<polygon points="565,390 720,465 565,540 410,465" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="465.0">Is everything right?</tspan></text>
<rect x="825" y="423" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="456.0">Change the size or the number,</tspan><tspan x="945" y="474.0">or remove an item.</tspan></text>
<circle cx="945" cy="573" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="573.0">A</tspan></text>
<rect x="420" y="582" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="615.0">Tap Check Out — review the order</tspan><tspan x="565" y="633.0">and choose where it goes.</tspan></text>
<polygon points="565,708 720,783 565,858 410,783" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="774.0">Do they have an</tspan><tspan x="565" y="792.0">address saved?</tspan></text>
<rect x="30" y="741" width="250" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="774.0">Add their address, then come</tspan><tspan x="155" y="792.0">back to check out.</tspan></text>
<circle cx="155" cy="891" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="891.0">B</tspan></text>
<polygon points="565,900 720,975 565,1050 410,975" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="975.0">How do they pay?</tspan></text>
<rect x="30" y="957" width="250" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="990.5">GCash — the app opens GCash</tspan><tspan x="155" y="1008.5">to pay. The order waits until</tspan><tspan x="155" y="1026.5">the payment is confirmed.</tspan></text>
<rect x="420" y="1092" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1125.0">Cash on pickup — they pay at the shop</tspan><tspan x="565" y="1143.0">when they collect it.</tspan></text>
<rect x="420" y="1218" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1251.0">The order is placed — the shop sees it</tspan><tspan x="565" y="1269.0">right away.</tspan></text>
<polygon points="420,1344 710,1344 710,1412.08 565,1436 420,1412.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="1373.5">Continue on page 11</tspan><tspan x="565" y="1390.5">Track the order</tspan></text>
<rect x="825" y="1345" width="240" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1372.5">The delivery fee and the</tspan><tspan x="945" y="1390.5">GCash fee are shown before</tspan><tspan x="945" y="1408.5">they confirm.</tspan></text>
<rect x="825" y="1478" width="240" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1505.5">If a GCash payment fails or</tspan><tspan x="945" y="1523.5">runs out of time, the order is</tspan><tspan x="945" y="1541.5">not placed — they can try again.</tspan></text>
