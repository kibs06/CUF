<polygon points="420,130 710,130 710,198.07999999999998 565,222 420,198.07999999999998" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="159.5">From page 1</tspan><tspan x="565" y="176.5">they tapped Sign up</tspan></text>
<rect x="420" y="264" width="290" height="198" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="300.0">They fill in the Create Account form:</tspan><tspan x="565" y="318.0">name · email · phone if they like,</tspan><tspan x="565" y="336.0">birthday by picking a date —</tspan><tspan x="565" y="354.0">must be 13 or older,</tspan><tspan x="565" y="372.0">gender if they like,</tspan><tspan x="565" y="390.0">password plus confirm,</tspan><tspan x="565" y="408.0">a strength hint as they type,</tspan><tspan x="565" y="426.0">and accept the Terms.</tspan></text>
<polygon points="565,504 720,579 565,654 410,579" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="570.0">Is every box filled</tspan><tspan x="565" y="588.0">in right, Terms accepted?</tspan></text>
<rect x="825" y="537" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="570.0">Show a message on the box</tspan><tspan x="945" y="588.0">that needs fixing.</tspan></text>
<circle cx="945" cy="687" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="687.0">A</tspan></text>
<polygon points="565,696 720,771 565,846 410,771" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="762.0">Is this email</tspan><tspan x="565" y="780.0">already registered?</tspan></text>
<rect x="825" y="753" width="240" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="786.5">Tell them the email is already</tspan><tspan x="945" y="804.5">in use — they can sign in or</tspan><tspan x="945" y="822.5">use another one.</tspan></text>
<circle cx="945" cy="922" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="922.0">B</tspan></text>
<rect x="420" y="888" width="290" height="65" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="920.5">Create the account.</tspan></text>
<polygon points="565,995 720,1070 565,1145 410,1070" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1061.0">Must the email</tspan><tspan x="565" y="1079.0">be confirmed? Usual is yes.</tspan></text>
<polygon points="845,1024 1045,1024 1045,1092.08 945,1116 845,1092.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="945" y="1053.5">Continue on page 4</tspan><tspan x="945" y="1070.5">Add their foot size</tspan></text>
<polygon points="420,1187 710,1187 710,1255.08 565,1279 420,1255.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="1216.5">Continue on page 3</tspan><tspan x="565" y="1233.5">Confirm the email</tspan></text>
<rect x="30" y="1188" width="250" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1215.5">The new account cannot be used</tspan><tspan x="155" y="1233.5">yet — the email must</tspan><tspan x="155" y="1251.5">be confirmed first.</tspan></text>
<rect x="825" y="1188" width="240" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1215.5">When no confirm is needed,</tspan><tspan x="945" y="1233.5">they skip the code and</tspan><tspan x="945" y="1251.5">go straight to foot size.</tspan></text>
