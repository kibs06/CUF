<polygon points="420,130 710,130 710,198.07999999999998 565,222 420,198.07999999999998" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="159.5">From page 6</tspan><tspan x="565" y="176.5">they tapped the messages icon</tspan></text>
<rect x="420" y="264" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="297.5">Messages shows one conversation</tspan><tspan x="565" y="315.5">per shop.</tspan><tspan x="565" y="333.5">Loaded from the Database.</tspan></text>
<circle cx="565" cy="403" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="403.0">DB1</tspan></text>
<rect x="420" y="469" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="502.5">They can start from a shop,</tspan><tspan x="565" y="520.5">a product, an order,</tspan><tspan x="565" y="538.5">or the messages list.</tspan></text>
<rect x="420" y="614" width="290" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="648.0">They type their question,</tspan><tspan x="565" y="666.0">or pick a ready note for</tspan><tspan x="565" y="684.0">a first order message.</tspan><tspan x="565" y="702.0">Saved to the Database.</tspan></text>
<circle cx="565" cy="772" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="772.0">DB1</tspan></text>
<rect x="420" y="838" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="871.5">Photos and short clips can go</tspan><tspan x="565" y="889.5">with the words. Own messages</tspan><tspan x="565" y="907.5">can be taken back.</tspan></text>
<rect x="420" y="983" width="290" height="141" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1017.5">The shop replies in the same</tspan><tspan x="565" y="1035.5">conversation — typing dots show</tspan><tspan x="565" y="1053.5">while they write. Ticks turn</tspan><tspan x="565" y="1071.5">once the shop has read.</tspan><tspan x="565" y="1089.5">Loaded from the Database.</tspan></text>
<circle cx="565" cy="1160" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1160.0">DB1</tspan></text>
<rect x="420" y="1226" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1259.0">A notification and a badge on the bell</tspan><tspan x="565" y="1277.0">let them know a reply is waiting.</tspan></text>
