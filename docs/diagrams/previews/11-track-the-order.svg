<rect x="420" y="264" width="290" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="298.0">My Orders lists every order,</tspan><tspan x="565" y="316.0">newest first: unpaid · being</tspan><tspan x="565" y="334.0">prepared · ready · to review ·</tspan><tspan x="565" y="352.0">cancelled.</tspan></text>
<polygon points="565,428 720,503 565,578 410,503" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="494.0">Do they want to</tspan><tspan x="565" y="512.0">cancel it?</tspan></text>
<rect x="825" y="442" width="240" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="476.0">Before the shop starts: cancel</tspan><tspan x="945" y="494.0">straight away. While it is being</tspan><tspan x="945" y="512.0">prepared: send a request and</tspan><tspan x="945" y="530.0">the shop decides.</tspan></text>
<rect x="420" y="620" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="653.0">Tap an order to follow it: new →</tspan><tspan x="565" y="671.0">being prepared → ready → handed over.</tspan></text>
<polygon points="565,746 720,821 565,896 410,821" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="821.0">Has it arrived?</tspan></text>
<rect x="825" y="779" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="812.0">Wait for the shop’s update —</tspan><tspan x="945" y="830.0">they get a notification.</tspan></text>
<circle cx="945" cy="929" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="929.0">A</tspan></text>
<rect x="420" y="938" width="290" height="65" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="970.5">Tap Confirm receipt — the order is done.</tspan></text>
<rect x="420" y="1045" width="290" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1079.0">Rate each pair in the order:</tspan><tspan x="565" y="1097.0">stars are a must, a few words</tspan><tspan x="565" y="1115.0">and up to 5 photos. One review</tspan><tspan x="565" y="1133.0">per pair — it can be edited later.</tspan></text>
<polygon points="420,1209 710,1209 710,1291.14 565,1320 420,1291.14" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="1237.1">Continue on page 6</tspan><tspan x="565" y="1254.1">Home</tspan><tspan x="565" y="1271.1">they can shop again</tspan></text>
<rect x="825" y="1248" width="240" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1275.0">An unpaid order can be paid</tspan><tspan x="945" y="1293.0">from the same screen.</tspan></text>
<rect x="30" y="1248" width="250" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1275.0">Only pairs from a delivered</tspan><tspan x="155" y="1293.0">order can be reviewed.</tspan></text>
