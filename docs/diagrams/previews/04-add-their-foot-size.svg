<polygon points="639.2898550724638,450.840579710145 801,450.840579710145 783,527.9661835748793 621.2898550724638,527.9661835748793" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.734299516908212" fill="#000000" text-anchor="middle"><tspan x="711.1449275362319" y="476.0">Type size and width</tspan><tspan x="711.1449275362319" y="489.4">themselves. Must pick</tspan><tspan x="711.1449275362319" y="502.8">a size first or it asks again.</tspan></text>
