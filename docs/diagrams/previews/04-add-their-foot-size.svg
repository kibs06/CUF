<rect x="420" y="283" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="316.5">Ask them to add foot size.</tspan><tspan x="565" y="334.5">Shown once. Never blocks —</tspan><tspan x="565" y="352.5">the account already exists.</tspan></text>
<polygon points="565,428 720,503 565,578 410,503" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="494.0">What do they</tspan><tspan x="565" y="512.0">choose?</tspan></text>
<rect x="30" y="442" width="250" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="476.0">Scan feet with the phone</tspan><tspan x="155" y="494.0">camera. Best pick.</tspan><tspan x="155" y="512.0">If it fails or access is denied,</tspan><tspan x="155" y="530.0">they land back here.</tspan></text>
<rect x="825" y="451.5" width="240" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="485.0">Type size and width</tspan><tspan x="945" y="503.0">themselves. Must pick</tspan><tspan x="945" y="521.0">a size first or it asks again.</tspan></text>
<rect x="420" y="620" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="653.0">Or skip for now. Instant —</tspan><tspan x="565" y="671.0">we remind them on Home later.</tspan></text>
<rect x="420" y="746" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="779.5">Size saved to the Database —</tspan><tspan x="565" y="797.5">or we remind them</tspan><tspan x="565" y="815.5">on the Home screen later.</tspan></text>
