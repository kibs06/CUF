<polygon points="336.0289855072464,324.6690821256039 535.1787439613527,324.6690821256039 517.1787439613527,401.79468599033817 318.0289855072464,401.79468599033817" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.734299516908212" fill="#000000" text-anchor="middle"><tspan x="426.6038647342995" y="349.8">Ask them to add foot size.</tspan><tspan x="426.6038647342995" y="363.2">Shown once. Never blocks —</tspan><tspan x="426.6038647342995" y="376.7">the account already exists.</tspan></text>
