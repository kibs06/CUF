<text font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="start"><tspan x="60" y="57.0">4 · Add their foot size</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="start"><tspan x="60" y="88.0">SoleVision — what the customer does · page 4 of 14</tspan></text>
<polyline points="565.0,241.0 565.0,283.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,386.0 565.0,428.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="410.0,503.0 280.0,503.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="720.0,503.0 825.0,503.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,578.0 565.0,620.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,704.0 565.0,746.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="155.0,564.0 155.0,772.9 420.0,772.9" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="945.0,554.5 945.0,803.1 710.0,803.1" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,830.0 565.0,872.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="565" y="411.0">Skip for now</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="345" y="507.0">Scan</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="772.5" y="507.0">Type it in</tspan></text>
<polygon points="420,130 710,130 710,212.14 565,241 420,212.14" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="158.1">From pages 3 or 2</tspan><tspan x="565" y="175.1">account ready — code</tspan><tspan x="565" y="192.1">done or no code needed</tspan></text>
<rect x="420" y="283" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="316.5">Ask them to add foot size.</tspan><tspan x="565" y="334.5">Shown once. Never blocks —</tspan><tspan x="565" y="352.5">the account already exists.</tspan></text>
<polygon points="565,428 720,503 565,578 410,503" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="494.0">What do they</tspan><tspan x="565" y="512.0">choose?</tspan></text>
<rect x="30" y="442" width="250" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="476.0">Scan feet with the phone</tspan><tspan x="155" y="494.0">camera. Best pick.</tspan><tspan x="155" y="512.0">If it fails or access is denied,</tspan><tspan x="155" y="530.0">they land back here.</tspan></text>
<rect x="825" y="451.5" width="240" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="485.0">Type size and width</tspan><tspan x="945" y="503.0">themselves. Must pick</tspan><tspan x="945" y="521.0">a size first or it asks again.</tspan></text>
<rect x="420" y="620" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="653.0">Or skip for now. Instant —</tspan><tspan x="565" y="671.0">we remind them on Home later.</tspan></text>
<rect x="420" y="746" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="779.0">Size saved — or we remind</tspan><tspan x="565" y="797.0">them on the Home screen later.</tspan></text>
<polygon points="420,872 710,872 710,940.08 565,964 420,940.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="901.5">Continue on page 6</tspan><tspan x="565" y="918.5">Home</tspan></text>
<rect x="825" y="873" width="240" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="900.5">The scan opens on top,</tspan><tspan x="945" y="918.5">so backing out lands</tspan><tspan x="945" y="936.5">exactly back here.</tspan></text>
</svg>