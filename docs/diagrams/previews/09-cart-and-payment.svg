<rect x="420" y="661" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="694.0">Tap Check Out — review the order</tspan><tspan x="565" y="712.0">and choose where it goes.</tspan></text>
<polygon points="565,787 720,862 565,937 410,862" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="853.0">Do they have an</tspan><tspan x="565" y="871.0">address saved in the Database?</tspan></text>
