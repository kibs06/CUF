<rect x="825" y="1696" width="240" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1723.5">If a GCash payment fails or</tspan><tspan x="945" y="1741.5">runs out of time, the order is</tspan><tspan x="945" y="1759.5">not placed — they can try again.</tspan></text>
