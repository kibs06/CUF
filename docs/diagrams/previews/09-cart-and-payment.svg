<polygon points="420,130 710,130 710,198.07999999999998 565,222 420,198.07999999999998" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="159.5">From pages 6, 7 or 8</tspan><tspan x="565" y="176.5">they opened the Cart</tspan></text>
<rect x="420" y="264" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="297.5">The Cart lists what they picked:</tspan><tspan x="565" y="315.5">the item, the size and how many.</tspan><tspan x="565" y="333.5">Loaded from the Database.</tspan></text>
<circle cx="565" cy="403" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="403.0">DB1</tspan></text>
