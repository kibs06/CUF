<circle cx="155" cy="970" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="970.0">B</tspan></text>
<polygon points="565,1039 720,1114 565,1189 410,1114" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1114.0">How do they pay?</tspan></text>
<rect x="30" y="1062.5" width="250" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1096.0">GCash — the app opens GCash</tspan><tspan x="155" y="1114.0">to pay. The order waits until</tspan><tspan x="155" y="1132.0">the payment is confirmed.</tspan></text>
<rect x="420" y="1231" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1264.0">Cash on pickup — they pay at the shop</tspan><tspan x="565" y="1282.0">when they collect it.</tspan></text>
<rect x="420" y="1357" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1390.5">The order is placed — the shop sees it</tspan><tspan x="565" y="1408.5">right away.</tspan><tspan x="565" y="1426.5">Saved to the Database.</tspan></text>
