<polygon points="420,130 710,130 710,198.07999999999998 565,222 420,198.07999999999998" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="159.5">From page 2</tspan><tspan x="565" y="176.5">the account was created</tspan></text>
<rect x="420" y="264" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="297.5">We email a 6-digit code</tspan><tspan x="565" y="315.5">plus a Confirm button.</tspan><tspan x="565" y="333.5">The code shows a countdown.</tspan></text>
<polygon points="565,409 720,484 565,559 410,484" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="475.0">How do they</tspan><tspan x="565" y="493.0">confirm it?</tspan></text>
<rect x="30" y="432.5" width="250" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="466.0">They tap the button in the</tspan><tspan x="155" y="484.0">email — it opens the app</tspan><tspan x="155" y="502.0">and confirms the account.</tspan></text>
<polygon points="845,438 1045,438 1045,506.08 945,530 845,506.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="945" y="467.5">Continue on page 5</tspan><tspan x="945" y="484.5">Sign in</tspan></text>
<rect x="420" y="601" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="634.0">They type the 6-digit code</tspan><tspan x="565" y="652.0">in the app.</tspan></text>
<polygon points="565,727 720,802 565,877 410,802" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="793.0">Is the code right</tspan><tspan x="565" y="811.0">and still valid?</tspan></text>
<rect x="825" y="769.5" width="240" height="65" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="802.0">Show an error message.</tspan></text>
<rect x="825" y="876.5" width="240" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="910.0">They can ask for a new code —</tspan><tspan x="945" y="928.0">a minute has to pass first.</tspan><tspan x="945" y="946.0">Too many tries are flagged.</tspan></text>
<circle cx="945" cy="1045.5" r="24" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1045.5">A</tspan></text>
<rect x="420" y="919" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="952.0">Account confirmed —</tspan><tspan x="565" y="970.0">they are signed in.</tspan></text>
<polygon points="420,1045 710,1045 710,1113.08 565,1137 420,1113.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="1074.5">Continue on page 4</tspan><tspan x="565" y="1091.5">Add their foot size</tspan></text>
<rect x="30" y="1046" width="250" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1073.5">They can close the app and</tspan><tspan x="155" y="1091.5">confirm later — it is asked</tspan><tspan x="155" y="1109.5">again next time.</tspan></text>
<rect x="825" y="1111.5" width="240" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1139.0">Back to sign in stops here —</tspan><tspan x="945" y="1157.0">the account stays unconfirmed</tspan><tspan x="945" y="1175.0">until they confirm.</tspan></text>
