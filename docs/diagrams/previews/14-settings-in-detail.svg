<rect x="825" y="1330.5" width="240" height="65" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1363.0">They stay — nothing changes.</tspan></text>
