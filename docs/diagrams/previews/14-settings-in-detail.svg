<rect x="420" y="283" width="290" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="317.0">Account and Security holds</tspan><tspan x="565" y="335.0">name, phone and email,</tspan><tspan x="565" y="353.0">the password link, fingerprint</tspan><tspan x="565" y="371.0">switch, 2-step codes, devices.</tspan></text>
<rect x="420" y="447" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="480.0">Extra sign-ins can be kept</tspan><tspan x="565" y="498.0">here to jump between accounts.</tspan></text>
<rect x="420" y="573" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="606.0">Theme sheet: follow the device,</tspan><tspan x="565" y="624.0">or pin Light or Dark.</tspan></text>
<rect x="420" y="699" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="732.0">Size Your Foot and My Addresses</tspan><tspan x="565" y="750.0">live here too.</tspan></text>
