<polygon points="565,989 720,1064 565,1139 410,1064" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1055.0">Log out or</tspan><tspan x="565" y="1073.0">delete the account?</tspan></text>
<rect x="825" y="1022" width="240" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1055.0">Log out — asks for confirm,</tspan><tspan x="945" y="1073.0">then the sign-in screen shows.</tspan></text>
