<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1338" viewBox="0 0 1100 1338">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#000000"/></marker></defs>
<rect x="4" y="4" width="1092" height="1330" fill="none" stroke="#000000" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="start"><tspan x="60" y="57.0">12 · Talk to the shop</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="start"><tspan x="60" y="88.0">SoleVision — what the customer does · page 12 of 14</tspan></text>
<polyline points="565.0,222.0 565.0,264.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,348.0 565.0,390.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,493.0 565.0,535.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,638.0 565.0,680.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,783.0 565.0,825.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,947.0 565.0,989.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="565.0,1073.0 565.0,1115.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="420,130 710,130 710,198.07999999999998 565,222 420,198.07999999999998" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="159.5">From page 6</tspan><tspan x="565" y="176.5">they tapped the messages icon</tspan></text>
<rect x="420" y="264" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="297.0">Messages shows one conversation</tspan><tspan x="565" y="315.0">per shop.</tspan></text>
<rect x="420" y="390" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="423.5">They can start from a shop,</tspan><tspan x="565" y="441.5">a product, an order,</tspan><tspan x="565" y="459.5">or the messages list.</tspan></text>
<rect x="420" y="535" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="568.5">They type their question,</tspan><tspan x="565" y="586.5">or pick a ready note for</tspan><tspan x="565" y="604.5">a first order message.</tspan></text>
<rect x="420" y="680" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="713.5">Photos and short clips can go</tspan><tspan x="565" y="731.5">with the words. Own messages</tspan><tspan x="565" y="749.5">can be taken back.</tspan></text>
<rect x="420" y="825" width="290" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="859.0">The shop replies in the same</tspan><tspan x="565" y="877.0">conversation — typing dots show</tspan><tspan x="565" y="895.0">while they write. Ticks turn</tspan><tspan x="565" y="913.0">once the shop has read.</tspan></text>
<rect x="420" y="989" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="1022.0">A notification and a badge on the bell</tspan><tspan x="565" y="1040.0">let them know a reply is waiting.</tspan></text>
<polygon points="420,1115 710,1115 710,1197.14 565,1226 420,1197.14" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="1143.1">Continue on page 6</tspan><tspan x="565" y="1160.1">Home</tspan><tspan x="565" y="1177.1">they can shop again</tspan></text>
<rect x="825" y="1135" width="240" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1162.5">Custom pairs are usually</tspan><tspan x="945" y="1180.5">arranged here, with photos</tspan><tspan x="945" y="1198.5">of the design.</tspan></text>
<rect x="30" y="1154" width="250" height="72" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="1181.0">Help and support chats live</tspan><tspan x="155" y="1199.0">under Profile, not here.</tspan></text>
</svg>