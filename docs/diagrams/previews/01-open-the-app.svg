<rect x="53.00210833603634" y="1052.4226402854363" width="724.6188777165099" height="90.57735971456374" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.420045410314628" fill="#000000" text-anchor="middle"><tspan x="415.3115471942913" y="1071.7">How to read this chart:</tspan><tspan x="415.3115471942913" y="1084.7">oval = the start or the end  ·  rectangle = a step  ·  parallelogram = typing or a message  ·  diamond = a question</tspan><tspan x="415.3115471942913" y="1097.7">pentagon holds a page code — the top one is this page, the rest say where to turn</tspan><tspan x="415.3115471942913" y="1110.7">small circle with a letter = the flow jumps back to the same letter</tspan><tspan x="415.3115471942913" y="1123.7">DB pentagon = the app saves that step  ·  DB1 circle = where it is saved</tspan></text>
