<rect x="83.99659057219094" y="1060.2101986362288" width="662.318410910169" height="82.78980136377112" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="8.610139341832197" fill="#000000" text-anchor="middle"><tspan x="415.1557960272754" y="1077.8">How to read this chart:</tspan><tspan x="415.1557960272754" y="1089.7">oval = the start or the end  ·  rectangle = a step  ·  parallelogram = typing or a message  ·  diamond = a question</tspan><tspan x="415.1557960272754" y="1101.6">pentagon holds a page code — the top one is this page, the rest say where to turn</tspan><tspan x="415.1557960272754" y="1113.5">small circle with a letter = the flow jumps back to the same letter</tspan><tspan x="415.1557960272754" y="1125.4">DB pentagon = the app saves that step  ·  DB1 circle = where it is saved</tspan></text>
