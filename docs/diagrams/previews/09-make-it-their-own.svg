<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="345" y="469.0">Ready-made</tspan></text>
<polygon points="420,130 710,130 710,198.07999999999998 565,222 420,198.07999999999998" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="159.5">From page 7</tspan><tspan x="565" y="176.5">they tapped Make it their own</tspan></text>
<rect x="420" y="264" width="290" height="84" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="297.0">Two ways to make it their own: pick the</tspan><tspan x="565" y="315.0">ready-made options, or design a pair.</tspan></text>
<polygon points="565,390 720,465 565,540 410,465" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="465.0">Which one?</tspan></text>
<rect x="30" y="404" width="250" height="122" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="155" y="438.0">Ready-made: choose the colour</tspan><tspan x="155" y="456.0">and material the shop offers</tspan><tspan x="155" y="474.0">for that shoe, then add it</tspan><tspan x="155" y="492.0">to the cart.</tspan></text>
<polygon points="50,568 260,568 260,636.08 155,660 50,636.08" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="155" y="597.5">Continue on page 10</tspan><tspan x="155" y="614.5">Cart and payment</tspan></text>
<rect x="420" y="582" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="615.5">Design a pair of their own: base shoe,</tspan><tspan x="565" y="633.5">colour and dye, upper material, engraving</tspan><tspan x="565" y="651.5">and sizing notes.</tspan></text>
<rect x="420" y="727" width="290" height="65" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="759.5">Review the choices and submit the design.</tspan></text>
<rect x="420" y="834" width="290" height="103" rx="0" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="565" y="867.5">The shop gets the request and asks</tspan><tspan x="565" y="885.5">them about the price and when</tspan><tspan x="565" y="903.5">it will be ready.</tspan></text>
<ellipse cx="565" cy="1024" rx="125" ry="45" fill="none" stroke="#000000" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="565" y="1024.0">END</tspan></text>
<rect x="825" y="978" width="240" height="91" rx="0" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000" text-anchor="middle"><tspan x="945" y="1005.5">The shop checks every custom</tspan><tspan x="945" y="1023.5">pair by hand, so it is not</tspan><tspan x="945" y="1041.5">added to the cart.</tspan></text>
