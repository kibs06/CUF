plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "dev.flutter.flutter-gradle-plugin"
    // Required only by the V0 virtual-fitting renderer spike (ComposeView host).
    id "org.jetbrains.kotlin.plugin.compose"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// ── Release signing ─────────────────────────────────────────────────────
// `android/key.properties` (git-ignored) holds the project's release keystore
// credentials — see docs/RELEASE_SIGNING.md.
//
// Why this exists: release builds used `signingConfigs.debug`, and a debug
// keystore is generated *per machine* (Android Studio/AGP creates
// $HOME/.android/debug.keystore the first time it signs a build, and a fresh
// CI runner starts without one). So every GitHub-built release was signed with
// a brand-new throwaway key, and Android refuses to replace an installed app
// whose signer differs — the "App not installed." dialog testers hit when the
// in-app updater handed a new APK to the package installer.
//
// One stable project key across every release is what makes an update
// installable over the previous version.
//
// No key.properties (fresh clone, fork, CI without the secrets) → fall back to
// the debug config so local work still builds. An APK built that way cannot be
// installed over a release-signed one and must never be published.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def hasReleaseSigning = keystorePropertiesFile.exists() && keystoreProperties['storeFile'] != null

android {
    namespace 'com.solevision.app'
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    // Keep the Kotlin JVM target aligned with the Java compile options above.
    // AGP's built-in Kotlin support defaults to JVM 17, which fails the build
    // with "Inconsistent JVM Target Compatibility" against VERSION_21.
    kotlinOptions {
        jvmTarget = '21'
    }

    // ARCore requires OpenGL ES 3.0 or later
    defaultConfig {
        // Ensure minSdk is at least 24 for ARCore
        minSdkVersion 24
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Compose is required only by the V0 virtual-fitting renderer spike
    // (com.solevision.app.artryon). The rest of the app stays View-based.
    buildFeatures {
        compose true
    }

    defaultConfig {
        applicationId 'com.solevision.app'
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        // V0.7 compression gate: instrumented gltfio decode test (androidTest only —
        // never part of a shipped build). Run with `:app:connectedDebugAndroidTest`.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Declared only when the credentials are present: an empty `release` config
    // fails the build at signing time with "Keystore file not set".
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // Relative to this module (android/app/) — same convention as
                // the Flutter template's key.properties.
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Debug fallback keeps local dev builds working; a published APK
            // must carry the project key instead (see the block above).
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    // ARCore SDK for foot scanning
    implementation 'com.google.ar:core:1.54.0'
    // Google ML Kit Pose Detection for foot landmarks
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta2'
    implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta2'
    // CameraX for camera access
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // OpenGL ES for AR rendering
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ── Virtual fitting V0 spike (docs/RoadMap/VIRTUAL_FITTING_ROADMAP.md) ──
    // SceneView 4.x is Compose-native: no View-based ARSceneView class exists
    // anymore, so the spike hosts it in a ComposeView inside a PlatformView —
    // the same shape SceneView's own Flutter bridge uses.
    //
    // PINNED ON PURPOSE — do not bump either line independently:
    //   • 4.37.0+ declares minCompileSdk=37 in its own AAR metadata (verified
    //     by reading META-INF/com/android/build/gradle/aar-metadata.properties
    //     in the published AAR), and 4.38.0+ additionally pulls Compose BOM
    //     2026.09.00 → Compose 1.12.x (compileSdk 37 + AGP 9.1.0). This
    //     project is on compileSdk 36 / AGP 8.11.1, so 4.34.0 is the newest
    //     usable release: minCompileSdk=1, BOM 2026.06.01 → Compose 1.11.4
    //     (minCompileSdk 35).
    //   • 4.34.0 also keeps ARCore at 1.54.0, the version the shipped foot
    //     scan is built against — no ARCore upgrade smuggled in.
    // Lifting this pin means planning an AGP 9.x + compileSdk 37 upgrade for
    // the whole app, not just this feature.
    // ── Virtual fitting V3.2 — the production try-on renderer ──
    // Declared directly rather than inherited from `arsceneview`: V0.7's D3 decision is to drive
    // Filament/gltfio ourselves, and a dependency the feature depends on should not disappear the
    // day the V0 spike (and its SceneView line) is retired.
    //
    // PINNED TO 1.72.1 ON PURPOSE — that is exactly what `io.github.sceneview:arsceneview:4.34.0`
    // resolves today (verified in the Gradle module cache: only 1.72.1 is present for both
    // artifacts). So while the spike is still in the build this changes no resolution, and the
    // V0.7 size measurement (variant C, ≈+6.4 MB per arm64 device) keeps meaning what it meant.
    implementation 'com.google.android.filament:filament-android:1.72.1'
    implementation 'com.google.android.filament:gltfio-android:1.72.1'

    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.runtime:runtime'
    // SceneView pulls foundation at runtime scope only; the spike calls
    // Modifier.fillMaxSize() directly, so it needs it on the compile classpath.
    implementation 'androidx.compose.foundation:foundation'
    implementation 'io.github.sceneview:arsceneview:4.34.0'

    // V0.7 compression gate — instrumented decode test (dev-only; test classpath only,
    // so this changes no shipped byte). See GltfioDecodeTest.
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
